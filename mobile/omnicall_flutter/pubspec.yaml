name: omnicall_flutter
description: OmniCall real-time translated voice calls.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  livekit_client: ^2.13.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  permission_handler: ^11.4.0
  connectivity_plus: ^7.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
